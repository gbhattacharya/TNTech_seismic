<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TNTech Cookeville Seismic Station Live</title>
  <!-- Auto-reloads every 120 seconds -->
  <meta http-equiv="refresh" content="120">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      background-color: #000;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    img {
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <img id="heli" alt="Live Cookeville TNTU Seismic Drum">

  <script>
    const STATION = "TNTU_HHZ_Z3_00";
    const img = document.getElementById('heli');

    function getTimestamp(dateObj) {
      const year = dateObj.getUTCFullYear();
      const month = String(dateObj.getUTCMonth() + 1).padStart(2, '0');
      const day = String(dateObj.getUTCDate()).padStart(2, '0');
      const block = dateObj.getUTCHours() >= 12 ? '12' : '00';
      return `${year}${month}${day}${block}`;
    }

    const now = new Date();
    const currentStamp = getTimestamp(now);

    // Calculate the previous 12-hour block timestamp as a safety fallback
    const past12h = new Date(now.getTime() - (12 * 60 * 60 * 1000));
    const previousStamp = getTimestamp(past12h);

    const primaryUrl = `https://folkworm.ceri.memphis.edu/heli_new/heli_temp/${STATION}.${currentStamp}.gif?v=${now.getTime()}`;
    const fallbackUrl = `https://folkworm.ceri.memphis.edu/heli_new/heli_temp/${STATION}.${previousStamp}.gif?v=${now.getTime()}`;

    // If the server hasn't generated the new file yet, fall back to the prior block
    img.onerror = function() {
      if (this.src !== fallbackUrl) {
        this.src = fallbackUrl;
      }
    };

    img.src = primaryUrl;
  </script>
</body>
</html>
